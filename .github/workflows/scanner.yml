name: Base Pump Lab Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scanner.py

      - name: Show result
        run: |
          echo "========================================"
          echo "BASE PUMP LAB RESULT"
          echo "========================================"

          python - <<'PY'
          import json

          with open(
              "data/base_research.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              f"Source pools: {data.get('source_pool_count')}"
          )

          print(
              f"Pages used: {data.get('pages_used')}"
          )

          print(
              f"Filtered pools: {data.get('count')}"
          )

          print(
              "========================================"
          )
          PY

          echo "========================================"
          echo "GENERATED FILES"
          echo "========================================"

          ls -lh data

      - name: Upload research data
        uses: actions/upload-artifact@v4
        with:
          name: base-research-data
          path: |
            data/base_research.json
